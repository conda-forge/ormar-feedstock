schema_version: 1

context:
  name: ormar
  version: "0.27.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/ormar-${{ version }}.tar.gz
  sha256: e2a651bf2a5a0a566ddc1ab46263d4471be30b20390b3994fdf06c772e495194

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - pip
    - poetry-core >=1.0.0
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}
    - pydantic >=2.11.9,<2.15
    - sqlalchemy >=2.0.40,<2.1
    - ormar-utils >=0.2.0
    - orjson >=3.6.4
    # from sqlalchemy[ayncio]
    - greenlet >=1

tests:
  - python:
      imports:
        - ormar
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: A simple async ORM with fastapi in mind and pydantic validation.
  license: MIT
  license_file: LICENSE.md
  description: |
    The ormar package is an async mini ORM for Python, with support for
    Postgres, MySQL, and SQLite. The main benefit of using ormar includes the
    ability to get an async ORM that can be used with async frameworks
    (fastapi, starlette etc.). Using ormar would simplly workflow with just one
    model to maintain—you don't have to maintain pydantic and other orm model
    (sqlalchemy, peewee, gino etc.)


  homepage: https://github.com/collerek/ormar
  documentation: https://collerek.github.io/ormar/

extra:
  recipe-maintainers:
    - thewchan
